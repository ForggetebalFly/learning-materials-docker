<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Каталог учебных материалов</title><style>
body{margin:0;background:#f3f6f4;color:#173a30;font:18px Arial,sans-serif}main{max-width:1000px;margin:60px auto;padding:32px}header{border-bottom:2px solid #b9d0c4;padding-bottom:24px}h1{font-size:38px;margin:12px 0}small{color:#547466}.grid{display:grid;grid-template-columns:2fr 1fr;gap:32px;margin-top:32px}article,form{background:white;padding:24px;border-radius:12px}article{margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}input,button{padding:12px;font-size:16px;box-sizing:border-box}input{width:100%;margin:8px 0 18px;border:1px solid #b9d0c4;border-radius:6px}button{background:#245c48;color:white;border:0;border-radius:6px;cursor:pointer}.tag{font-size:14px;color:#547466;margin-top:8px}.remove{background:#f1e4df;color:#763b2a}footer{margin-top:30px;color:#547466}</style></head><body><main>
<header><small>УЧЕБНАЯ ПРАКТИКА · ЗАДАНИЕ 4</small><h1>Каталог учебных материалов</h1><div>Демидов Д.М. · группа 634 · Flask + Docker</div></header>
<div class="grid"><section>{% for r in rows %}<article><div><strong>{{r.title}}</strong><div class="tag">{{r.category}} · № {{r.id}}</div></div><button class="remove" onclick="fetch('/api/resources/{{r.id}}',{method:'DELETE'}).then(()=>location.reload())">Удалить</button></article>{% endfor %}</section><form method="post" action="/api/resources"><h2>Новый материал</h2><label>Название<input name="title" required maxlength="150"></label><label>Тема<input name="category" value="Docker" required></label><button>Добавить материал</button></form></div><footer>Материалов в каталоге: {{rows|length}} · Данные хранятся в JSON внутри контейнера</footer></main></body></html>
